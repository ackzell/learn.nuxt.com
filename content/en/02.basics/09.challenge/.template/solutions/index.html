<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="myApp">
      <p>{{ message }}</p>
      Current Version is: <code>{{ version }}</code>
    </div>

    <script type="module">
      import { createApp, ref, version } from 'vue'

      createApp({
        setup() {
          const message = ref('Hola Vue!')
          return {
            message,
            version,
          }
        },
      }).mount('#myApp')
    </script>
  </body>
</html>
